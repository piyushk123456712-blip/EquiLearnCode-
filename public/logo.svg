<svg viewBox="0 0 500 300" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0084c7" />
      <stop offset="100%" stop-color="#004375" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d00" />
      <stop offset="100%" stop-color="#eb6a00" />
    </linearGradient>
  </defs>

  <!-- Binary Data Tail -->
  <g fill="#0077b6" font-family="monospace" font-size="14" font-weight="bold">
    <text x="75" y="140">1</text>
    <text x="90" y="115">0</text>
    <text x="100" y="95">1</text>
    <text x="85" y="165">0</text>
    <text x="105" y="180">0</text>
    <text x="115" y="200">1</text>
    <path d="M 120 150 Q 90 145 75 125" stroke="#0077b6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 130 160 Q 100 165 95 185" stroke="#0077b6" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Book Icon -->
  <g transform="translate(130, 65)">
    <path d="M 0 30 Q 20 20 40 30 L 40 55 Q 20 45 0 55 Z" fill="none" stroke="#0077b6" stroke-width="4"/>
    <path d="M 40 30 Q 60 20 80 30 L 80 55 Q 60 45 40 55 Z" fill="none" stroke="#0077b6" stroke-width="4"/>
    <!-- Star Above Book -->
    <path d="M 40 0 L 44 12 L 56 16 L 44 20 L 40 32 L 36 20 L 24 16 L 36 12 Z" fill="url(#orangeGrad)"/>
  </g>

  <!-- Code Bracket Icon [<>] -->
  <g transform="translate(210, 50)">
    <text x="0" y="45" fill="#0077b6" font-family="sans-serif" font-size="40" font-weight="bold">[</text>
    <path d="M 25 25 L 15 35 L 25 45" stroke="url(#orangeGrad)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 35 25 L 45 35 L 35 45" stroke="url(#orangeGrad)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="45" fill="#0077b6" font-family="sans-serif" font-size="40" font-weight="bold">]</text>
  </g>

  <!-- Lightbulb Icon -->
  <g transform="translate(280, 30)">
    <circle cx="15" cy="15" r="10" fill="none" stroke="url(#orangeGrad)" stroke-width="3"/>
    <path d="M 10 25 L 20 25" stroke="url(#orangeGrad)" stroke-width="3"/>
    <line x1="15" y1="0" x2="15" y2="3" stroke="url(#orangeGrad)" stroke-width="3"/>
    <line x1="3" y1="5" x2="6" y2="8" stroke="url(#orangeGrad)" stroke-width="3"/>
    <line x1="27" y1="5" x2="24" y2="8" stroke="url(#orangeGrad)" stroke-width="3"/>
  </g>

  <!-- Dynamic Horse Silhouette -->
  <path d="M 140 180 
           C 170 160, 200 150, 240 145 
           C 280 140, 310 110, 340 95 
           C 350 90, 370 75, 380 95
           C 390 110, 410 120, 430 130
           C 400 145, 395 160, 380 170
           C 365 180, 380 200, 390 220
           L 375 225
           C 360 205, 350 190, 335 190
           C 320 190, 300 220, 290 240
           C 275 260, 260 260, 250 240
           C 240 220, 230 200, 215 195
           C 200 190, 180 220, 150 245 Z" 
        fill="none" stroke="url(#blueGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Horse Mane Details -->
  <path d="M 345 105 C 320 120, 300 110, 275 130" stroke="url(#blueGrad)" stroke-width="5" fill="none"/>
  <path d="M 330 120 C 310 135, 290 130, 270 145" stroke="url(#blueGrad)" stroke-width="5" fill="none"/>
</svg>
